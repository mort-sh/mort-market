# identity-scrub configuration
#
# Per-project settings for .githooks/identity-scrub.sh.
# Copy .githooks/ into another repo and edit only this file.

# Canonical identity. Any commit whose identity is not preserved below is
# rewritten to this name/email (both author and committer).
SCRUB_NAME="m0rt"
SCRUB_EMAIL="mort@paradox.zone"

# Identities preserved exactly as-is, one "Name <email>" per line.
# Matching is exact on the full "Name <email>" string.
# The canonical identity above is always preserved implicitly.
SCRUB_PRESERVE="
mort-sh <mort@paradox.zone>
"
